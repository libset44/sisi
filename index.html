<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sisi — GitHub Pages site" />
  <title>Sisi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at 20% 20%, #253b80 0, transparent 36%), #0b1020;
    }
    .card {
      width: min(720px, 100%);
      padding: clamp(2rem, 6vw, 5rem);
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 24px;
      background: rgba(15, 23, 42, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: #93c5fd;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 6rem); line-height: .95; }
    p { color: #cbd5e1; font-size: 1.15rem; line-height: 1.7; max-width: 52ch; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: .8rem 1.1rem;
      border-radius: 999px;
      background: #60a5fa;
      color: #0b1020;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #93c5fd; }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Welcome to</p>
      <h1 id="title">Sisi</h1>
      <p>This GitHub Pages site is ready. Replace this message with your project documentation, portfolio, or product landing page.</p>
      <a href="https://github.com/libset44/sisi">View the repository</a>
    </section>
  </main>
</body>
</html>
